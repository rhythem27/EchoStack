[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = test_pipeline
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    unit: Unit tests for core functions and models
    api: Integration tests for REST API endpoints
    integration: Workflow and proxy integration tests
    websocket: WebSocket protocol tests
